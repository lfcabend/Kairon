[versions]
springBoot = "4.1.1"
nodeGradle = "7.1.0"
archunit = "1.4.1"
bucket4j = "8.14.0"
bouncycastle = "1.81"
# Not part of the Spring Boot BOM, so pinned explicitly (M7 D13). Re-check the
# latest 3.x release compatible with the Spring Boot version above whenever it's
# bumped — springdoc's major version tracks Spring Boot's own.
springdoc = "3.1.0"
# M8: the official Anthropic Java SDK, wrapped by assistant.llm.AnthropicClient
# and contained there by ArchUnit (docs/adr/0002). Not part of any BOM.
anthropicJava = "2.34.0"
# M8 D6/D15: circuit breaker around the Anthropic call. Confirmed compiling and
# auto-configuring cleanly against springBoot 4.1.1 (full existing test suite green
# with this on the classpath) — see docs/milestones/M8-*.md D15/Q1.
resilience4j = "2.3.0"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
# Rate limiting for the auth endpoints. The core library plus a small servlet filter,
# not the Spring Boot starter (its Boot 4 readiness is unverified — see docs/DESIGN.md §14).
bucket4j-core = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
# BouncyCastle is not managed by the Spring Boot BOM; needed for Argon2id hashing.
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropicJava" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
