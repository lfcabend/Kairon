spring:
  application:
    name: kairon
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kairon}
    username: ${SPRING_DATASOURCE_USERNAME:kairon}
    password: ${SPRING_DATASOURCE_PASSWORD:kairon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # true here is the default for host bootRun (the `local` profile, no k8s
    # involved). In every k8s environment migrations run instead as a Helm
    # pre-install/pre-upgrade hook Job (deploy/helm/kairon/templates/
    # migration-job.yaml), and the chart's ConfigMap overrides this to false via
    # SPRING_FLYWAY_ENABLED (M7 D4).

logging:
  level:
    com.kairon: INFO
  pattern:
    # CorrelationIdFilter puts a per-request id in the MDC; surface it in the plain
    # console pattern. The `prod` profile swaps the console for ECS JSON, where MDC
    # entries are emitted as fields and this pattern is unused.
    correlation: "[%X{correlationId:-}] "

# M8 D6/Q5: conservative starting values for the circuit breaker around the
# Anthropic call, pending real traffic to tune against.
resilience4j:
  circuitbreaker:
    instances:
      anthropic:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  port: 8080
  shutdown: graceful
  servlet:
    # Mounts the whole app (API, actuator, and the SPA) under one path so several
    # personal apps can share a host/Tailscale Funnel node. Must match the frontend's
    # Vite `base` (web/vite.config.ts) and the Helm chart's `ingress.path`.
    context-path: /kairon

kairon:
  security:
    jwt:
      # Any string of reasonable entropy; it is SHA-256'd to the 256-bit HS256 key.
      # Override in every real environment (Helm wires KAIRON_JWT_SECRET from a Secret).
      secret: ${KAIRON_JWT_SECRET:dev-insecure-secret-change-me-please-0000000000}
      issuer: kairon
      access-token-ttl: PT15M
    refresh-token:
      ttl: P30D
      cookie:
        name: kairon_refresh
        secure: true
    rate-limit:
      enabled: true
      capacity: 10
      refill-period: PT1M
      paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/auth/refresh
  todo:
    # How far back a rollover sweep reaches for stranded OPEN items (the list is
    # worked irregularly, so this is a window, not "yesterday"). Also the span cap
    # on GET /todo?from=&to=.
    rollover-look-back-days: 14
    range-max-days: 92
  journal:
    # Span cap on GET /journal?from=&to= and /journal/entry-days?from=&to=.
    range-max-days: 92
  assistant:
    # Master switch (docs/adr/0002) — off everywhere by default (M8 D16); an
    # operator must also create the ANTHROPIC_API_KEY secret for the feature to
    # leave "dark". Override via KAIRON_ASSISTANT_ENABLED.
    enabled: ${KAIRON_ASSISTANT_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-5
    # A generated project plan (M8.5) can legitimately take well over 30s —
    # a real 20-task/dependency plan observed ~90s of Anthropic latency. Kept
    # below the ingress's own proxy-read/send-timeout (150s, deploy/helm/kairon/
    # values.yaml) so this fires first and returns a clean application/problem+json
    # 503 instead of nginx's blunt HTML 504.
    request-timeout: PT120S
    # Sum of input+output tokens per user per UTC calendar month before new runs
    # are refused (M8 D8). ~500k tokens/month is a conservative starting cap at
    # Sonnet pricing — tune once there's real usage to look at.
    monthly-token-budget-per-user: 500000
    todo-suggestions:
      # Context window defaults (M8 D9) — every number here is deliberately a
      # config default, not a hardcoded constant.
      history-days: 7
      journal-lookback-days: 21
      journal-entry-limit: 5
      max-suggestions: 5
      # LOW | MEDIUM | HIGH | XHIGH | MAX (Anthropic output_config.effort).
      # A bounded extraction/classification task on a synchronous request path —
      # MEDIUM balances quality against latency until a real run says otherwise.
      effort: MEDIUM
    project-plan:
      # Cap on a generated plan's task count (M8.5 D7) — bounds prompt/response
      # cost and review-screen size for a runaway description.
      max-tasks: 40
    rate-limit:
      enabled: true
      capacity: 5
      refill-period: PT10M
      paths:
        - /api/v1/assistant/todo-suggestions
        - /api/v1/assistant/project-plan
