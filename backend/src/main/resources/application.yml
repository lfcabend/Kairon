spring:
  application:
    name: kairon
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kairon}
    username: ${SPRING_DATASOURCE_USERNAME:kairon}
    password: ${SPRING_DATASOURCE_PASSWORD:kairon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # In Kubernetes (M7) Flyway will move to a Helm pre-upgrade Job and this flips
    # to false; for M0 the app runs migrations on startup in every environment.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    git:
      mode: full

server:
  port: 8080
  shutdown: graceful

kairon:
  security:
    jwt:
      # Any string of reasonable entropy; it is SHA-256'd to the 256-bit HS256 key.
      # Override in every real environment (Helm wires KAIRON_JWT_SECRET from a Secret).
      secret: ${KAIRON_JWT_SECRET:dev-insecure-secret-change-me-please-0000000000}
      issuer: kairon
      access-token-ttl: PT15M
    refresh-token:
      ttl: P30D
      cookie:
        name: kairon_refresh
        secure: true
    rate-limit:
      enabled: true
      capacity: 10
      refill-period: PT1M
      paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/auth/refresh
  todo:
    # How far back a rollover sweep reaches for stranded OPEN items (the list is
    # worked irregularly, so this is a window, not "yesterday"). Also the span cap
    # on GET /todo?from=&to=.
    rollover-look-back-days: 14
    range-max-days: 92
