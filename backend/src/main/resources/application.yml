spring:
  application:
    name: kairon
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kairon}
    username: ${SPRING_DATASOURCE_USERNAME:kairon}
    password: ${SPRING_DATASOURCE_PASSWORD:kairon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # In Kubernetes (M7) Flyway will move to a Helm pre-upgrade Job and this flips
    # to false; for M0 the app runs migrations on startup in every environment.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    git:
      mode: full

server:
  port: 8080
  shutdown: graceful
