# Host dev loop. Expects PostgreSQL reachable on localhost:5432 — get it by
# port-forwarding the in-cluster database (`task db-forward`). There is no
# docker-compose in this project.
#
# Defaults assume a dedicated `kairon` role + database; override any of them with
# the SPRING_DATASOURCE_* environment variables (env wins over this file) to point
# at an existing instance, e.g. a Bitnami postgres running as the `postgres`
# superuser.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kairon}
    username: ${SPRING_DATASOURCE_USERNAME:kairon}
    password: ${SPRING_DATASOURCE_PASSWORD:kairon}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Local dev only: expose every Actuator endpoint and show health component detail.
# The base application.yml keeps prod locked to health + info.
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    com.kairon: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG

kairon:
  security:
    refresh-token:
      cookie:
        # The Vite dev server and bootRun both serve plain http on localhost.
        secure: false
  # A dev-only seeded account (DevDataSeeder, local profile only). Used by the
  # Playwright happy path; set seed-user: false to skip.
  dev:
    seed-user: true
    seed-email: dev@kairon.local
    seed-password: dev-password-please
    seed-display-name: Dev User
  # M8: on for local dev/e2e, with a canned FakeAnthropicClient standing in for
  # the real SDK client (fake-client: true) — no real ANTHROPIC_API_KEY needed,
  # and `task e2e` never makes a real network call to Anthropic
  # (docs/milestones/M8-assistant-foundations.md §9 Q3). The user still has to
  # opt in per feature via Settings, same as any real deployment.
  assistant:
    enabled: true
    api-key: fake-key-not-sent-anywhere-fake-client-is-active
    fake-client: true
