version: "3"

# Thin wrappers around the underlying tools (see docs/DESIGN.md §9). Requires
# go-task: https://taskfile.dev
#
# Local dependencies (PostgreSQL) run in a local Kubernetes cluster (kind) via
# this project's own Helm chart — there is no docker-compose. For a fast host
# reload loop, `task db-forward` exposes the in-cluster Postgres on localhost:5432
# so `task be` can reach it.

vars:
  HELM_RELEASE: kairon
  HELM_CHART: deploy/helm/kairon
  # Local image reference. The tag is the git commit sha so every commit produces a
  # distinct `kairon:<sha>` and `helm upgrade` always rolls the Deployment to it
  # (no more stale-image confusion). A dirty working tree appends `-wip<utc-ts>`,
  # which is re-evaluated per `task` invocation — so with uncommitted changes use
  # `task up` (builds + loads + deploys as one run); the individual image / image-
  # load / helm-local tasks only line up on a committed (clean) tree. Override the
  # repo with IMAGE_REPO=… .
  IMAGE_REPO: '{{.IMAGE_REPO | default "kairon"}}'
  IMAGE_TAG:
    sh: |
      sha=$(git rev-parse --short=12 HEAD 2>/dev/null || echo unknown)
      if [ -z "$(git status --porcelain 2>/dev/null)" ]; then
        printf '%s' "$sha"
      else
        printf '%s-wip%s' "$sha" "$(date -u +%Y%m%d%H%M%S 2>/dev/null || echo $RANDOM)"
      fi
  IMAGE: '{{.IMAGE_REPO}}:{{.IMAGE_TAG}}'
  # GHCR image for remote clusters. `task xbmc` builds + pushes here (needs
  # `docker login ghcr.io` once) and deploys with values-xbmc.yaml, which already
  # points image.repository at this same path.
  GHCR_REPO: '{{.GHCR_REPO | default "ghcr.io/lfcabend/kairon"}}'
  GHCR_IMAGE: '{{.GHCR_REPO}}:{{.IMAGE_TAG}}'
  # Remote k3s deploy target. The kube-context is pinned on the helm call so a
  # wrong current-context cannot misfire the deploy.
  XBMC_CONTEXT: '{{.XBMC_CONTEXT | default "xbmc"}}'
  XBMC_NAMESPACE: '{{.XBMC_NAMESPACE | default "kairon"}}'
  # The local Kubernetes node keeps its own containerd image store that a plain
  # `docker build` does NOT populate (Docker Desktop and kind both). `task
  # image-load` pushes the built image into it. Node container name: Docker Desktop
  # = desktop-control-plane; kind = <cluster>-control-plane.
  KUBE_NODE: '{{.KUBE_NODE | default "desktop-control-plane"}}'
  # Where the dev PostgreSQL lives in the cluster. Override on the CLI, e.g.
  #   task db-forward PG_NAMESPACE=default PG_SVC=kairon-postgresql
  PG_NAMESPACE: '{{.PG_NAMESPACE | default "postgres"}}'
  PG_SVC: '{{.PG_SVC | default "postgresql"}}'
  PG_LOCAL_PORT: '{{.PG_LOCAL_PORT | default "5432"}}'
  # Local port for `task app-forward` (the in-cluster kairon Service is :8080).
  APP_LOCAL_PORT: '{{.APP_LOCAL_PORT | default "8080"}}'
  # go-task runs cmds through a built-in POSIX shell; on Windows a relative
  # ./gradlew(.bat) does not resolve, so call the wrapper by absolute path.
  GW: '{{if eq OS "windows"}}cmd /c "{{.TASKFILE_DIR}}\\gradlew.bat"{{else}}{{.TASKFILE_DIR}}/gradlew{{end}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  up:
    desc: Build the image (tagged with the git sha), load it into the local node, and deploy.
    cmds:
      - task: image
      - task: image-load
      - task: helm-local

  down:
    desc: Uninstall the Helm release from the current context.
    cmds:
      - helm uninstall {{.HELM_RELEASE}}

  helm-local:
    desc: helm dependency update + upgrade --install with the local overlay, pinned to the current image tag.
    cmds:
      - helm dependency update {{.HELM_CHART}}
      - >-
        helm upgrade --install {{.HELM_RELEASE}} {{.HELM_CHART}}
        -f {{.HELM_CHART}}/values-local.yaml
        --set image.repository={{.IMAGE_REPO}}
        --set image.tag={{.IMAGE_TAG}}
        --wait
      - 'echo "deployed {{.IMAGE}}"'

  image-push:
    desc: Build the one image and push it to GHCR (ghcr.io/lfcabend/kairon:<sha> + :latest). Needs `docker login ghcr.io`.
    cmds:
      - docker build -f docker/Dockerfile -t {{.GHCR_IMAGE}} -t {{.GHCR_REPO}}:latest .
      - docker push {{.GHCR_IMAGE}}
      - docker push {{.GHCR_REPO}}:latest
      - 'echo "pushed {{.GHCR_IMAGE}}"'

  xbmc:
    desc: Build, push to GHCR, and deploy to the xbmc k3s cluster (kube-context "xbmc", namespace "kairon").
    cmds:
      - task: image-push
      - >-
        helm upgrade --install {{.HELM_RELEASE}} {{.HELM_CHART}}
        --kube-context {{.XBMC_CONTEXT}}
        --namespace {{.XBMC_NAMESPACE}} --create-namespace
        -f {{.HELM_CHART}}/values-xbmc.yaml
        --set image.tag={{.IMAGE_TAG}}
        --wait --timeout 65m
      - 'echo "deployed {{.GHCR_IMAGE}} to context {{.XBMC_CONTEXT}}"'

  ingress:
    desc: Install/upgrade the ingress-nginx controller (serves http://kairon.localtest.me).
    cmds:
      - >-
        helm upgrade --install ingress-nginx ingress-nginx
        --repo https://kubernetes.github.io/ingress-nginx
        --namespace ingress-nginx --create-namespace --wait

  db-forward:
    desc: Port-forward the in-cluster Postgres to localhost for host dev (keep running).
    cmds:
      - kubectl -n {{.PG_NAMESPACE}} port-forward svc/{{.PG_SVC}} {{.PG_LOCAL_PORT}}:5432

  app-forward:
    desc: Port-forward the deployed kairon Service to localhost (no ingress needed; keep running).
    cmds:
      - kubectl port-forward svc/{{.HELM_RELEASE}} {{.APP_LOCAL_PORT}}:8080

  be:
    desc: Run the backend on the host with the local Spring profile (needs db-forward).
    cmds:
      - "{{.GW}} :backend:bootRun --args='--spring.profiles.active=local'"

  fe:
    desc: Run the Vite dev server (proxies /api to localhost:8080).
    dir: web
    cmds:
      - npm run dev

  test:
    desc: Run all tests (backend + web). Backend integration tests use Testcontainers.
    cmds:
      - "{{.GW}} test"
      - "{{.GW}} :web:testWeb"

  build:
    desc: Full build — SPA + backend + all checks.
    cmds:
      - "{{.GW}} build"

  jar:
    desc: Package the single deployable jar.
    cmds:
      - "{{.GW}} :backend:bootJar"

  image:
    desc: Build the one Docker image (API + SPA), tagged with the git sha (and a moving :dev alias).
    cmds:
      - docker build -f docker/Dockerfile -t {{.IMAGE}} -t {{.IMAGE_REPO}}:dev .
      - 'echo "built {{.IMAGE}}"'

  image-load:
    desc: Push the built image into the local Kubernetes node's own image store.
    cmds:
      - |
        if docker inspect {{.KUBE_NODE}} >/dev/null 2>&1; then
          echo "loading {{.IMAGE}} into node {{.KUBE_NODE}}"
          docker save {{.IMAGE}} | docker exec -i {{.KUBE_NODE}} ctr -n k8s.io images import -
        elif command -v kind >/dev/null 2>&1; then
          echo "loading {{.IMAGE}} via kind"
          kind load docker-image {{.IMAGE}}
        else
          echo "No node container '{{.KUBE_NODE}}' and no kind CLI on PATH." >&2
          echo "Set KUBE_NODE=<node-container-name> (e.g. kind-control-plane)." >&2
          exit 1
        fi

  image-prune:
    desc: Drop old kairon images from the local node, keeping the current tag and :dev.
    cmds:
      - >-
        docker exec {{.KUBE_NODE}} sh -c
        "ctr -n k8s.io images ls -q
        | grep '^docker.io/library/{{.IMAGE_REPO}}:'
        | grep -v ':{{.IMAGE_TAG}}$' | grep -v ':dev$'
        | xargs -r ctr -n k8s.io images rm"

  manifests:
    desc: Render the chart to one plain-YAML file (build/manifests.yaml) for review (no cluster).
    cmds:
      - mkdir -p build
      # Single file: app + Postgres subchart, every resource, in apply order.
      # For one-file-per-resource instead, swap the redirect for: --output-dir build/manifests
      - helm template {{.HELM_RELEASE}} {{.HELM_CHART}} -f {{.HELM_CHART}}/values-local.yaml > build/manifests.yaml

  helm-lint:
    desc: Lint the chart and validate rendered manifests (needs kubeconform on PATH).
    cmds:
      - helm dependency update {{.HELM_CHART}}
      - helm lint {{.HELM_CHART}} -f {{.HELM_CHART}}/values-local.yaml
      - helm template {{.HELM_RELEASE}} {{.HELM_CHART}} -f {{.HELM_CHART}}/values-local.yaml | kubeconform -strict -summary -ignore-missing-schemas
