org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 9's new built-in-Kotlin DSL isn't yet well-supported by the third-party
# plugins this project needs (Hilt/kapt/Room/openapi-generator) — opt out and
# keep applying org.jetbrains.kotlin.android the traditional way. Still
# supported through AGP 9.x; removed in AGP 10 (mid-2026), at which point this
# needs revisiting.
android.builtInKotlin=false
android.newDsl=false
# M11.4 — the app's API base URL, read by app/build.gradle.kts into a
# BuildConfig field. This committed default is the emulator-dev value
# (10.0.2.2 is the Android emulator's alias for the host loopback); override
# per-machine in the gitignored local.properties to point at a real deployed
# backend instead, e.g.:
#   kairon.apiBaseUrl=https://xbmc.tail9ae0e9.ts.net/kairon/
kairon.apiBaseUrl=http://10.0.2.2:8080/kairon/
