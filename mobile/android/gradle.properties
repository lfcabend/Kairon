org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 9's new built-in-Kotlin DSL isn't yet well-supported by the third-party
# plugins this project needs (Hilt/kapt/Room/openapi-generator) — opt out and
# keep applying org.jetbrains.kotlin.android the traditional way. Still
# supported through AGP 9.x; removed in AGP 10 (mid-2026), at which point this
# needs revisiting.
android.builtInKotlin=false
android.newDsl=false
# M11.4 — one API base URL per product flavor (app/build.gradle.kts'
# "environment" flavor dimension), each read into that flavor's own
# BuildConfig.API_BASE_URL. 10.0.2.2 is the Android emulator's alias for the
# host loopback; the "local" default below targets the Docker Desktop k8s
# deployment's ingress-nginx on the host's plain :80 (task up / values-local.yaml),
# not a bootRun-on-:8080 backend. Override either per-machine in the
# gitignored local.properties, e.g. a physical device's own LAN IP for
# "local":
#   kairon.apiBaseUrl.local=http://192.168.1.50/kairon/
kairon.apiBaseUrl.local=http://10.0.2.2/kairon/
kairon.apiBaseUrl.prod=https://xbmc.tail9ae0e9.ts.net/kairon/
