org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 9's new built-in-Kotlin DSL isn't yet well-supported by the third-party
# plugins this project needs (Hilt/kapt/Room/openapi-generator) — opt out and
# keep applying org.jetbrains.kotlin.android the traditional way. Still
# supported through AGP 9.x; removed in AGP 10 (mid-2026), at which point this
# needs revisiting.
android.builtInKotlin=false
android.newDsl=false
# M11.4 — one API base URL per product flavor (app/build.gradle.kts'
# "environment" flavor dimension).
#
# "local" targets the Docker Desktop k8s deployment's "kairon" Service on
# :8080 via `task app-forward` (kubectl port-forward, "no ingress needed")
# rather than ingress-nginx on :80 — the Ingress rule is Host-header-matched
# to "localhost" (values-local.yaml's ingress.host), so a request whose Host
# header is anything else (what every alternative below sends) wouldn't
# match it even on a successful connection.
#
# The emulator-loopback alias 10.0.2.2 (used by every other flavor-ish value
# this project has tried) turned out unreliable here even for a direct
# connection on :8080, timing out intermittently (SocketTimeoutException)
# despite the same destination answering instantly and repeatedly to raw TCP
# from an `adb shell` session on the same device — i.e. the emulator's own
# NAT translation for 10.0.2.2, not the backend or the host network, was the
# flaky part (found 2026-10-08). Switched to an `adb reverse tcp:8080
# tcp:8080` tunnel instead: run that once per emulator session (alongside
# `task app-forward`, which must stay running too) and the device's own
# 127.0.0.1:8080 becomes a direct ADB-managed pipe to the host's :8080 —
# confirmed reliable where 10.0.2.2 wasn't. A physical device has no such
# tunnel available and needs its own LAN-IP override instead, e.g.:
#   kairon.apiBaseUrl.local=http://192.168.1.50:8080/kairon/
kairon.apiBaseUrl.local=http://127.0.0.1:8080/kairon/
kairon.apiBaseUrl.prod=https://xbmc.tail9ae0e9.ts.net/kairon/
