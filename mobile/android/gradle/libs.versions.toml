room = "2.8.5"
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinxSerializationJson = "1.11.0"
securityCrypto = "1.1.0"
datastorePreferences = "1.2.1"
openapiGenerator = "7.14.0"
junit = "4.13.2"
mockk = "1.14.2"
turbine = "1.2.0"
