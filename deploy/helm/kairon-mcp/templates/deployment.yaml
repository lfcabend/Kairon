apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kairon-mcp.fullname" . }}
  labels:
    {{- include "kairon-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kairon-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kairon-mcp.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kairon-mcp.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # matches the uid baked into docker/mcp-server.Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kairon-mcp-server
          image: {{ include "kairon-mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "kairon-mcp.fullname" . }}
          # No Secret mounted at all (D1-auth) — nothing secret to store; every
          # request carries its own caller's personal access token.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
