# Local (docker-desktop / kind) overlay: small footprint, plain HTTP ingress on
# http://localhost (the ingress-nginx controller binds the host's :80). Using the
# bare "localhost" host avoids any /etc/hosts or public-DNS dependency.
#
# Database: reuse the standalone PostgreSQL already installed in the cluster
# (Bitnami chart, Helm release "postgresql" in namespace "postgres"), which holds
# a "kairon" database owned by the "kairon" role. The bundled subchart is off;
# the app connects cross-namespace via the service FQDN below. The name/username/
# password here must match that instance.

image:
  repository: kairon
  tag: dev
  pullPolicy: IfNotPresent

springProfiles: prod

ingress:
  enabled: true
  className: nginx
  host: localhost
  tls:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Fixed dev secret so restarts / re-installs don't drop local sessions. Not sensitive.
security:
  jwtSecret: local-dev-kairon-jwt-secret-not-for-any-real-use

postgresql:
  enabled: false

database:
  host: postgresql.postgres.svc.cluster.local
  port: 5432
  name: kairon
  username: kairon
  password: kairon
