# M7 D7: daily pg_dump to the PVC above, gzipped and timestamped, with a
# find-based prune for anything older than retentionDays. The pg_dump client
# image's major version must be >= the server's (pg_dump refuses to dump a
# newer server) — set via backup.pgDumpImage rather than hardcoded, since the
# actually-running engine has already drifted past DESIGN.md's stated
# "PostgreSQL 16" once (confirmed PostgreSQL 18.6 on both xbmc and local kind
# during the M7 trial deploy — see docs/milestones/M7-hardening-prod.md).
{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kairon.fullname" . }}-backup
  labels:
    {{- include "kairon.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "kairon.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.backup.pgDumpImage | quote }}
              env:
                - name: PGHOST
                  value: {{ .Values.database.host | default (printf "%s-postgresql" .Release.Name) | quote }}
                - name: PGPORT
                  value: {{ .Values.database.port | default 5432 | quote }}
                - name: PGDATABASE
                  value: {{ .Values.database.name | quote }}
                - name: PGUSER
                  value: {{ .Values.database.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "kairon.databaseSecretName" . }}
                      key: SPRING_DATASOURCE_PASSWORD
              command:
                - sh
                - -c
                - >-
                  set -eu;
                  pg_dump | gzip > /backups/kairon-$(date +%Y%m%dT%H%M%S).sql.gz;
                  find /backups -name 'kairon-*.sql.gz' -mtime +{{ .Values.backup.retentionDays }} -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "kairon.fullname" . }}-backups
{{- end }}
