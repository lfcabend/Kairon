apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kairon.fullname" . }}
  labels:
    {{- include "kairon.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "kairon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kairon.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kairon.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # matches the uid baked into docker/Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kairon
          image: {{ include "kairon.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "kairon.fullname" . }}
          env:
            # About page facts (docs/DESIGN.md §11) that only exist at deploy time —
            # unlike the git commit and build time (baked into the jar's
            # build-info.properties), these can't be known when the image is built.
            # NB: KAIRON_DEPLOYED_AT is re-rendered on every `helm upgrade`, so it
            # always differs and always triggers a rollout, even a no-op re-apply —
            # the point is that a running pod's "deployed at" is accurate.
            - name: KAIRON_IMAGE_REF
              value: {{ include "kairon.image" . | quote }}
            - name: KAIRON_DEPLOYED_AT
              value: {{ now | date "2006-01-02T15:04:05Z07:00" | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kairon.databaseSecretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
            - name: KAIRON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kairon.appSecretName" . }}
                  key: KAIRON_JWT_SECRET
            {{- if .Values.assistant.existingSecret }}
            # M8: no Helm-generated fallback (values.yaml) — only wired when an
            # operator has created assistant.existingSecret; otherwise the app
            # never sees this env var at all and stays dark (docs/adr/0002).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.assistant.existingSecret }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.ingress.path }}/actuator/health/readiness
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ingress.path }}/actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.ingress.path }}/actuator/health/readiness
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
