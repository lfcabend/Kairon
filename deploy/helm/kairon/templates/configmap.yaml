apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kairon.fullname" . }}
  labels:
    {{- include "kairon.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfiles | quote }}
  SPRING_DATASOURCE_URL: {{ include "kairon.jdbcUrl" . | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.username | quote }}
