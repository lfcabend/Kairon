{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kairon.databaseSecretName" . }}
  labels:
    {{- include "kairon.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
{{- if not .Values.security.existingSecret }}
---
{{/*
  JWT signing secret. Precedence: an explicit security.jwtSecret wins; otherwise
  reuse the value already stored in the cluster (so `helm upgrade` doesn't rotate
  it and drop every session); otherwise generate one on first install. Pin it via
  security.existingSecret in prod (M7 secrets tooling).
*/}}
{{- $secretName := include "kairon.appSecretName" . }}
{{- $current := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $reused := "" }}
{{- if and $current $current.data (hasKey $current.data "KAIRON_JWT_SECRET") }}
{{-   $reused = index $current.data "KAIRON_JWT_SECRET" | b64dec }}
{{- end }}
{{- $jwtSecret := .Values.security.jwtSecret | default $reused | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kairon.labels" . | nindent 4 }}
type: Opaque
stringData:
  KAIRON_JWT_SECRET: {{ $jwtSecret | quote }}
{{- end }}
