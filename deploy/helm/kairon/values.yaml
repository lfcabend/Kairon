# Default values for the Kairon chart. Overlaid by values-<env>.yaml. M7 adds the
# Flyway migration Job (every environment), HPA (values-prod.yaml only), and the
# backup CronJob (values-xbmc.yaml only) — see docs/milestones/M7-hardening-prod.md.

image:
  repository: ghcr.io/lfcabend/kairon
  tag: ""            # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# Flyway migrator image (M7 D5), run by templates/migration-job.yaml as a Helm
# pre-install/pre-upgrade hook in every environment. Both fields default off the
# app image above when empty (see kairon.migratorImage in _helpers.tpl) — the two
# images are always built and pushed together, so this rarely needs overriding.
migrator:
  image:
    repository: ""
    tag: ""

replicaCount: 1

# Deployment update strategy. The app runs a single replica, so a RollingUpdate
# briefly runs two pods (surge) — two JVMs booting at once starve each other on a
# small node, the new pod misses its startup probe, and the old ReplicaSet never
# scales down (see values-xbmc.yaml). "Recreate" stops the old pod first, trading
# a few seconds of downtime — acceptable for a single-user app — for a clean roll.
deploymentStrategy:
  type: Recreate

# Startup gate: failureThreshold * periodSeconds is the time the app has to answer
# /actuator/health/readiness before the kubelet kills it. First boot runs Flyway
# and initialises Hibernate, so this needs headroom on slower nodes.
startupProbe:
  failureThreshold: 30
  periodSeconds: 5

# The Deployment controller's own rollout clock — independent of, and typically
# tighter than, startupProbe's per-pod budget above. It does NOT reset on a pod
# restart, so it must comfortably exceed startupProbe's failureThreshold *
# periodSeconds (with room for at least one restart) or the rollout can be
# marked "Failed: Progress deadline exceeded" even while a pod is still mid-boot.
# Kubernetes' own default is 600s.
progressDeadlineSeconds: 600

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: kairon.localtest.me
  extraHosts: []   # additional hostnames routed to the same backend, e.g. a Tailscale Funnel name
  # Mount path for the app — must match the backend's server.servlet.context-path
  # (backend/src/main/resources/application.yml) and the frontend's Vite `base`
  # (web/vite.config.ts), so several personal apps can share one host.
  path: /kairon
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Spring profile the container runs with.
springProfiles: prod

# Auth (M1). The JWT signing secret is rendered into the Secret alongside the DB
# password. Leave jwtSecret empty for a throwaway local install (a random one is
# generated per `helm upgrade`, which invalidates any live sessions); for prod set
# security.existingSecret to a Secret that carries KAIRON_JWT_SECRET (M7 secrets work).
security:
  jwtSecret: ""
  existingSecret: ""

# Non-secret app config, rendered into the ConfigMap.
config:
  SPRING_DATASOURCE_URL: ""   # computed from the postgresql release name when empty

# Datasource credentials, rendered into the Secret. For a real deployment these
# come from an existingSecret (M7); here they seed both the app and the subchart.
database:
  name: kairon
  username: kairon
  password: kairon
  existingSecret: ""
  # In-cluster database host. Empty = use the bundled postgresql subchart
  # ({release}-postgresql). Set to an FQDN (e.g.
  # postgresql.postgres.svc.cluster.local) to reuse an external install; pair
  # that with postgresql.enabled=false.
  host: ""
  port: 5432

# Bitnami PostgreSQL subchart — on for local/kind, off in prod (external DB).
# The subchart's default engine version is used for local dev; prod points at an
# external PostgreSQL 18 (see docs/DESIGN.md §8.4) and sets postgresql.enabled=false.
postgresql:
  enabled: true
  auth:
    username: kairon
    password: kairon
    database: kairon
  primary:
    persistence:
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# HPA (M7 D2). Off everywhere except values-prod.yaml — xbmc is a single 2-core
# node with nothing to scale onto, so autoscaling only makes sense against a real
# managed cluster. Ignored while disabled; templates/hpa.yaml renders nothing.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# pg_dump backup CronJob to a local PVC (M7 D7). Off by default; enabled and
# tuned in values-xbmc.yaml, the environment actually holding real data today.
# Off-node replication is explicitly out of scope — see deploy/RUNBOOK.md.
backup:
  enabled: false
  schedule: "0 3 * * *"     # daily 03:00
  retentionDays: 14
  # pg_dump refuses to dump a server newer than itself, so this must track
  # whatever Postgres major version is actually running (check with `kubectl
  # exec ... -- psql -c 'select version()'`) — a values field rather than a
  # hardcoded tag because the docs' previously-stated "PostgreSQL 16" had
  # already silently drifted to the 18.6 actually running in both xbmc and
  # local kind, confirmed during the M7 trial deploy (docs/milestones/
  # M7-hardening-prod.md) and now corrected everywhere else in the docs too.
  pgDumpImage: postgres:18-alpine
  pvc:
    size: 2Gi
