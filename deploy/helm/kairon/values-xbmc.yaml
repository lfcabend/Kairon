# xbmc (home k3s) overlay.
#
# Cluster:  single-node k3s "xbmc" @ 192.168.2.3 — containerd runtime, Traefik
#           ingress (default ingressClass "traefik", LoadBalancer on the node IP),
#           local-path default StorageClass.
# Image:    pulled from GHCR (ghcr.io/lfcabend/kairon and, since M7,
#           ghcr.io/lfcabend/kairon-migrator for the Flyway migration Job). Push a
#           tag, then deploy with `--set image.tag=<tag>` (the migrator image tag
#           follows automatically — see kairon.migratorImage in _helpers.tpl).
#           Both GHCR packages must be PUBLIC — the chart does not wire
#           imagePullSecrets, so a private package cannot be pulled without
#           editing the chart (M7 Q3 — deferred, not planned).
# Database: reuse the existing Bitnami PostgreSQL — Helm release "my-postgres" in
#           namespace "postgres", service my-postgres-postgresql. That install
#           only ships the "postgres" superuser and a "mydatabase" DB, so a
#           dedicated login role + database must be created first (SQL is in the
#           deploy notes). The bundled postgresql subchart stays OFF.

image:
  repository: ghcr.io/lfcabend/kairon
  tag: ""                 # falls back to Chart.appVersion — always pass --set image.tag=<git-sha>
  pullPolicy: IfNotPresent

springProfiles: prod

ingress:
  enabled: true
  className: traefik
  host: xbmc              # bare LAN hostname; resolves to 192.168.2.3
  extraHosts:
    - xbmc.tail9ae0e9.ts.net   # Tailscale Funnel hostname (public internet access)
  tls:
    enabled: false

resources:
  requests:
    cpu: 500m
    memory: 640Mi
  limits:
    cpu: "2"          # single k3s node has 2 cores; unthrottled startup is ~3x faster
    memory: 1Gi

# This node is slow on a cold start (Spring context init alone ~60s under the old
# 1-core cap). During the M3 deploy the node was pegged at 99% CPU from something
# running on the HOST, outside Kubernetes entirely (`kubectl top pods -A` summed
# to a few hundred m against a reported 1999m/2000m node usage) — every restart
# throws away all JIT/class-loading progress and starts the clock over, so a
# tight budget here is actively counterproductive under that kind of contention.
# 30 min gives one cold boot real room to finish even in that state.
startupProbe:
  failureThreshold: 360
  periodSeconds: 5

# Comfortably above startupProbe's budget above (this clock does not reset on a
# pod restart) so a slow-but-succeeding boot isn't cut off by the Deployment
# controller independently of, and before, the pod's own startup probe gives up.
progressDeadlineSeconds: 3600

# M7 D7: on-node pg_dump backups. Single point of failure by explicit choice
# (local-path PVC, same node as the database) — see deploy/RUNBOOK.md's "Known
# risk" section. 2Gi / 14 days is a starting point; revisit once real dumps exist
# to measure against.
backup:
  enabled: true
  schedule: "0 3 * * *"
  retentionDays: 14
  pvc:
    size: 2Gi

# Left empty on purpose: the chart generates a JWT signing secret on first install
# and then reuses the value already in the cluster on every later `helm upgrade`
# (so live sessions are not dropped). Set security.existingSecret instead if you
# want the secret managed outside Helm.
security:
  jwtSecret: ""

# Use the standalone PostgreSQL already in the cluster, not the bundled subchart.
postgresql:
  enabled: false

database:
  host: my-postgres-postgresql.postgres.svc.cluster.local
  port: 5432
  name: kairon
  username: kairon
  # The password is kept OUT of git. Create the Secret out of band (once), then it
  # survives every `helm upgrade` because the chart no longer manages it:
  #   kubectl -n kairon create secret generic kairon-db \
  #     --from-literal=SPRING_DATASOURCE_PASSWORD=<the kairon role's password>
  existingSecret: kairon-db
